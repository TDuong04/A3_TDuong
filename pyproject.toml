[project]
name = "a3-rl-agents"
version = "0.1.0"
description = "RMIT Games and AI A3 — reinforcement learning and deep RL agents"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
