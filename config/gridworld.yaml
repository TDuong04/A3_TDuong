# Part I training parameters.
# Rubric B3 requires epsilon decay to be config-driven — do not copy these values into code.

training:
  episodes: 3000
  alpha: 0.1                    # learning rate
  gamma: 0.95                   # discount factor
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 2000  # linear decay window; epsilon held at epsilon_end afterwards
  max_steps_per_episode: 300    # guards against non-terminating episodes
  seed: 0
  intrinsic_reward_strength: 0.0  # overridden by the level-6 experiment below

# Task 5 (Level 6). Run the same level twice, once with each strength, and plot both curves.
intrinsic_experiment:
  level: 6
  strengths: [0.0, 0.5]
  episodes: 5000

# Per-level overrides merged on top of `training`. Levels with monsters are stochastic and need
# more episodes to average out; the cliff level needs a longer decay so SARSA's risk aversion has
# time to appear.
level_overrides:
  1:
    # 4000 was not enough and the symptom was misleading: both algorithms detoured to row 6 and the
    # C3 comparison showed two identical policies. The cause was Q-learning, not SARSA. The cells
    # along row 7 are only reached by an agent that has already survived several steps beside the
    # fire, so they are the last states in the level to converge; until they do, Q-learning's own
    # greedy policy avoids the row it should be hugging. At 8000/6000 Q-learning finds the 11-step
    # edge route and SARSA still detours (13 steps) on seeds 0, 1 and 2. epsilon_end stays at the
    # shared 0.05: it was never the problem, and at 0.05 the risk is still priced in.
    episodes: 8000
    epsilon_decay_episodes: 6000
  4:
    # 6000/4000 trained a policy that *looked* fine and evaluated as broken. The training curve
    # settled at a mean return of 2.41-2.53 out of 3, but the greedy (epsilon 0) rollout on seeds
    # 0 (Q-learning) and 2 (SARSA) never collected anything after the first apple: it oscillated
    # between (3,2) and (4,2) forever, on Q values of 0.7879 vs 0.7867. Monster positions are not
    # part of the state key, so the greedy policy is a fixed map from (row, col, has_key, mask) to
    # an action, and two adjacent cells whose values have not separated by more than the 5% per
    # step that gamma=0.95 implies produce a two-cycle the epsilon-greedy behaviour policy hides.
    # It is a convergence symptom, not a stalemate: at 12000/8000 all ten runs (seeds 0-4 x both
    # algorithms) leave the cycle behind, truncate in 0% of 300 greedy rollouts each, and land on
    # a 69-78% success rate at ~20.5 steps against the BFS lower bound of 21. Raising further to
    # 20000 and 30000 changed nothing measurable, so 12000 is the budget, not a floor to keep
    # lifting. epsilon_end stays at the shared 0.05.
    episodes: 12000
    epsilon_decay_episodes: 8000
  5:
    # The same failure as level 4, at 8000/5000: seed 1 truncated 31% (Q-learning) and 24% (SARSA)
    # of greedy rollouts at a mean return of 0.99 out of 4, having circled instead of crossing to
    # the key. Two monsters and the key/chest ordering make this the slowest level to separate its
    # values. At 16000/10000 all ten runs (seeds 0-4 x both algorithms) are clean: 0% truncation
    # over 300 greedy rollouts each, 45-54% success, ~25 steps against the BFS lower bound of 28.
    # Worth recording that the recovery is not monotone in the budget — 25000/15000 reintroduced
    # the cycle on Q-learning seed 1 and 40000/24000 on SARSA seed 2 — which is why the number
    # here is the smallest budget that was clean across every seed tried rather than the largest
    # budget affordable. max_steps stays at 400: the level's optimum is 28 steps, so the cap only
    # ever fires on a policy that has stopped making progress.
    episodes: 16000
    epsilon_decay_episodes: 10000
    max_steps_per_episode: 400

  6:
    # Level 6 is the only level whose step cap was tighter than its own layout. Its BFS optimum is
    # 54 steps (start -> key 36, key -> chest 18), so the shared cap of 300 is 5.6x the optimum,
    # against 14.3x on levels 4 and 5, 17.6x on level 0 and 8.8x on level 3 - the tightest in the
    # set by a factor of two, and on a one-cell-wide spiral the cap is what an undirected agent
    # runs out of first. 800 puts level 6 on the same 14.8x ratio levels 4 and 5 already use.
    #
    # Chosen from the ratio the other levels already had, and not by picking the cap that most
    # flattered the intrinsic bonus - it flatters it least. Q-learning, 5000 episodes, seeds 0-4,
    # share of episodes that opened the chest at strength 0.0 vs 0.5, and how many of the 5 seeds
    # ended with a greedy policy that solves the level:
    #
    #   cap  300:  0.0% / 0.0%    greedy 0/5 vs 0/5   - neither arm ever solves it; the F-row
    #                                                   figure would be two flat lines at zero
    #   cap  400:  0.1% / 0.0%    greedy 0/5 vs 0/5
    #   cap  500: 12.2% / 2.5%    greedy 3/5 vs 0/5
    #   cap  600: 63.8% / 11.9%   greedy 5/5 vs 0/5
    #   cap  800: 88.9% / 39.5%   greedy 5/5 vs 0/5   <- the budget below
    #   cap 1000: 96.9% / 50.0%   greedy 5/5 vs 0/5
    #
    # The bonus loses at every cap, so the choice of cap is not what produces the F-row result;
    # 300 would merely have hidden it behind two flat lines. `episodes` for the experiment comes
    # from the `intrinsic_experiment` block above; a plain `--level 6` run uses the shared 3000.
    max_steps_per_episode: 800

rendering:
  cell_size: 56
  fps: 30           # frame rate of the window; training runs headless
  show_policy_arrows: true
  show_q_values: false
  animation_seconds: 0.12   # slide duration between cells; clamped below the step interval
  steps_per_second: 6.0     # simulation speed during visual rollout, adjusted live with +/-

  # Playback only (`eval/play_gridworld.py`); the renderer itself never reads these.
  playback_restart_seconds: 1.5   # pause on the finished episode before replaying it
  compare_cell_size: 40           # smaller cells so two panels fit side by side in one window
