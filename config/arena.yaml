# Part II training parameters.
# The baseline below is the sweep's starting point; `sweep` lists the axes varied around it.

training:
    algorithm: PPO # PPO or DQN (brief permits either)
    # 400k was the budget until the difficulty rebalance, and it silently stopped being enough:
    # slower enemies, 5s spawn intervals and a tankier player stretched mean episode length ~4x
    # (245 -> ~1050 steps under random play), so the same 400k bought roughly a quarter of the
    # episodes and a quarter of the episode-level signal. Retrained at 400k both styles collapsed
    # -- `direct` to -8.03 return and 1/30 phases cleared, barely above the -12.16 random baseline.
    # The identical config at 1.6M recovers and beats the old numbers (rotation +353 vs +228,
    # 30/30 cleared, 93% survival). Costs ~112s per model on CPU, so the budget is not the
    # constraint; noticing it was.
    total_timesteps: 1600000
    n_envs: 8 # SubprocVecEnv; requires an `if __name__ == "__main__":` guard on Windows
    learning_rate: 0.0003
    n_steps: 2048
    batch_size: 512
    # gamma's effective horizon is 1/(1-gamma): 100 steps at 0.99, which was ~40% of an episode
    # before the rebalance (~245 steps under random play) but only ~5% of one now (episodes run
    # ~1600-2000 steps post-rebalance). `direct` clears a phase roughly every ~530 steps, which
    # 0.99 discounts to 0.99^530 = 0.005 -- almost invisible to the agent, and it was the style
    # measured worst-hit by the rebalance. Swept at 400k-budget-equivalent (full 1.6M budget, both
    # styles) and confirmed on 3 additional seeds for `direct` specifically, since a single-seed
    # shaping sweep earlier the same day reversed completely on 3 seeds and the lesson was not to
    # trust one again:
    #   direct,   seed 1 (shipped): 0.99 +52.72 / 0.997 +72.38 / 0.999 +68.92 (return)
    #   direct,   seeds 2+3 (confirm): 0.99 +22.08+-1.37 / 0.997 +47.38+-13.75 (survival 32%->48%)
    #   rotation, seed 0 (shipped): 0.99 +353.29 / 0.997 +357.69 / 0.999 +348.95
    # 0.997 (horizon ~333) wins for direct on every seed tried and is a mild, lower-variance
    # improvement for rotation; 0.999 (horizon 1000) is worse for both, consistent with a horizon
    # that has outrun what `n_steps=2048` can bootstrap accurately.
    gamma: 0.997
    ent_coef: 0.005 # non-zero: guards against early policy collapse to a single action
    net_arch: [64, 64] # rubric J2 requires at least one hidden layer
    seed: 0

# The two reward terms beyond the brief's fixed list in arena/constants.py, and the brief's own
# escape hatch for them: "optional shaping rewards must be justified." Both potential-based only
# (F = gamma * phi(s') - phi(s), see arena/env.py's ShapingConfig), so they leave the optimal
# policy provably unchanged regardless of the strengths below -- justify the choice to use them at
# all in the report, not the magnitude. Both at 0.0 disables shaping outright and falls back to
# exactly the brief's reward list.
#
# BOTH SHIP AT 0.0. Shaping was measured net-harmful and both models are trained without it, so
# the reward is exactly the brief's fixed list. The history below is why, because "we tried it and
# turned it off" is a result the report cites, not an absence of work.
#
# Round 1 built these terms against a cosine potential and shipped rotation at
# aim=.005/safety=.02. Watching that agent play turned up four behaviours, and instrumenting it
# over 6 deterministic episodes turned up three defects in the terms themselves:
#
#   * `_aim_potential` tracked only the nearest living *enemy* and returned 0.0 once they were
#     gone, so with the arena cleared nothing pointed the ship at the spawners it still had to
#     kill. The agent idled through 40.7% of every episode.
#   * its lead was solved against the target's velocity *relative to the ship*, but a bullet gets
#     a fixed world-frame velocity and inherits nothing from the ship -- so it aimed at a point no
#     bullet flies through. Measured: 0.59 rad (34 deg) of commanded-heading error from ship
#     motion alone, matching the 33.6 deg median the live model actually fired at.
#   * `cos(bearing error)` is stationary at 180 deg, exactly where an enemy chasing from astern
#     sits: turning either way paid only 1-cos(10 deg) = 0.015 per decision, so the policy had
#     nothing to learn from. One episode crossed the nose 392 times without settling.
#
# All three are fixed in `arena/env.py` (see `_aim_potential`), and `_safety_potential` now
# saturates at `safe_distance` instead of scaling by the arena diagonal. Round 2 then retrained
# rotation at five strengths, 400k steps, top three confirmed on 3 seeds (mean +- sd, 6
# deterministic episodes/seed):
#
#   config                corner%     hit-rate      spawners    empty-arena%   nose-crossings
#   OFF (0, 0)          2.6 +- 1.7   28.6 +- 10.9  188 +- 84     40.4 +- 5.7    62 +- 31   <- shipped
#   aim=.02 safety=.02  16.9 +- 14.4 16.3 +- 15.2   95 +- 112    26.8 +- 4.8    47 +- 32
#   aim=.005 safety=.02 21.4 +- 15.9 10.4 +- 4.1    39 +- 23     24.9 +- 2.3   162 +- 38
#
# Corrected terms did not rescue the idea. Aim shaping cuts idle time but collapses spawner kills
# (188 -> 39): it points the ship at a spawner and orbits it, the same failure the round-1 search
# saw at aim>=0.05. Safety shaping still parks the ship in corners at any strength -- saturating
# the potential was not enough, because in a bounded arena "flee the enemy" ends at a wall by
# construction. Note the standard deviations: the shaped rows are unstable, not merely worse.
#
# Unshaped is what beat the shipped model on the behaviours that prompted this: corner dwelling
# 15.0% -> 2.6%, nose-crossings ~89 -> 62, hit-rate and spawner kills unchanged.
#
# Not fixed, and not fixable here: the agent fires at 32% of steps against a 33% cooldown ceiling
# -- it holds the trigger. A miss costs nothing, so spraying is optimal, and potential-based
# shaping is *provably policy-invariant* and therefore cannot make aiming optimal instead. Only a
# mechanic change (scarcer shots, limited ammo) or a non-potential-based miss penalty would move
# it, and the latter is exactly what the brief forbids. Documented as a limitation, not tuned at.
#
# Seeds: rotation ships from seed 0, direct from seed 1 -- neither is the checked-in
# `training.seed`, the same per-style-override convention `--seed` has always used.
shaping:
    aim_strength: 0.0 # coefficient on gamma*phi(s')-phi(s); phi = 1 - |bearing error| / pi to the lead point
    safety_strength: 0.0 # coefficient on gamma*phi(s')-phi(s); phi = distance/safe_distance, saturating at 1
    # Range at which the ship is "far enough" and the safety term stops paying for more retreat.
    # It used to scale by the arena diagonal (1174 px), which meant every extra pixel of backing
    # away scored higher -- and the farthest points in a rectangle are its corners, so the term was
    # maximised by wedging into one (measured: corner 0.88 vs mid-arena 0.41, and corner dwelling
    # 0.9% -> 15.0% of steps after the rebalance made the player tanky enough to survive there).
    # 300 px is comfortably outside contact range for the fastest configured enemy (70 px/s) while
    # still inside the arena's short axis, so "keep your distance" stays learnable and "hide in the
    # corner" stops being worth anything.
    safe_distance: 300

# Reduced-budget sweep for rubric J3 and report row R5. One axis varied at a time from the
# baseline; winner re-run on 3 seeds before being trusted.
sweep:
    budget_timesteps: 100000
    control_style: direct # learns fastest, so it discriminates between configs soonest
    axes:
        learning_rate: [0.0001, 0.0003, 0.001]
        n_steps: [512, 2048, 4096]
        ent_coef: [0.0, 0.005, 0.01]
        gamma: [0.95, 0.99]
        net_arch: [[64, 64], [128, 128]]
    confirm_seeds: [0, 1, 2]
    confirm_top_k: 2 # a one-seed win is not a result; the best two are re-run on every seed
    summary_episodes: 100 # episodes at the tail of a run averaged into its reported metrics
    # Phase gain at or below this, with episode reward up, is flagged as suspected reward hacking,
    # so the flag reads as "did not move beyond noise". Sized against the seed-to-seed spread actually
    # measured at this budget (top two configs: 1.027 +- 0.012 and 1.020 +- 0.008 over seeds 0-2),
    # which is roughly two standard deviations. Note how small that spread is next to the gap between
    # configs: at 100k the axes are not separated, which is why the winner is not auto-promoted.
    reward_hack_phase_tolerance: 0.02
    # Deterministic episodes per model in the promote stage. The tables above rank on
    # training-time stochastic rollouts; what ships is the deterministic policy, so the promote
    # decision is measured separately and can disagree with the ranking that produced it.
    promote_episodes: 30

# Phase 1 must be clearable in roughly 20-30 seconds by a trained agent, because the video rubric
# requires at least one visible phase progression. Difficulty lives in phases 2+.
phases:
    - spawners: 2
      spawner_health: 3
      enemy_health: 1
      enemy_speed: 50 # pixels/second
      spawn_interval: 5.0 # seconds
    - spawners: 3
      spawner_health: 4
      enemy_health: 1
      enemy_speed: 60
      spawn_interval: 5.0
    - spawners: 4
      spawner_health: 5
      enemy_health: 1
      enemy_speed: 70
      spawn_interval: 5.0

# Divisors the observation vector saturates against. They are caps, not live maxima: rescaling a
# feature by whatever happened to be on screen would mean the same number described different
# worlds in different episodes.
observation:
    enemy_count_cap: 20 # `enemies alive` reads 1.0 at or above this many
    spawner_count_cap: 6 # comfortably above the largest `spawners` entry in `phases`

# Episode-level rules the env enforces around the entities: how a phase is laid out and how much
# of the arena may be alive at once.
episode:
    max_enemies: 70 # live-enemy cap; bounds step() cost across a 400k-timestep run
    arena_margin: 60 # pixels; spawners stay off the walls so the player can circle them
    min_player_clearance: 220 # pixels; a new phase never drops a spawner onto the player
    min_spawner_separation: 140
    placement_attempts: 40 # rejection samples before the best candidate so far is accepted

player:
    max_health: 10
    speed: 380 # max speed, pixels/second - the SAME cap for both control styles
    thrust: 450 # pixels/second^2 - the same acceleration for both control styles
    rotation_speed: 300 # degrees/second (style 1 only; style 2 faces where it moves)
    drag: 0.9 # velocity retained per second of coasting, applied as drag ** dt
    shoot_cooldown: 0.25 # seconds
    bullet_speed: 520 # pixels/second
    invulnerability_time: 0.6 # seconds after taking a hit
    radius: 14 # collision radius, pixels (collision is circle-vs-circle)

# Geometry and damage for everything that is not the player. Collision is circle-vs-circle, so
# every entity needs a radius; `max_bullets` is the live cap that stops an uncapped bullet list
# from slowing step() to a crawl deep into a 400k-timestep run.
entities:
    enemy_radius: 12
    spawner_radius: 22
    bullet_radius: 4
    bullet_damage: 1
    bullet_lifetime: 1.6 # seconds before a missed shot expires
    max_bullets: 12
    enemy_contact_damage: 1

evaluation:
    deterministic: true
    episodes: 5
    fps: 60
    show_observation_overlay: true # the debug overlay; doubles as report figure and video moment
    show_policy_overlay: true # action probabilities and V(s): the algorithm, on screen

# Renderer-only feedback. These values never enter physics, rewards, or observations.
visual_feedback:
    muzzle_seconds: 0.10
    hit_seconds: 0.24
    explosion_seconds: 0.55
    shake_seconds: 0.20
    shake_pixels: 4
    particle_speed: 95
    particle_count: 12
    max_events: 32

# Enabled together by --mechanics in training and playback; baseline remains reproducible.
mechanics:
    pickup_lifetime: 10.0
    pickup_radius: 12
    elite_first_phase: 2
    elite_health: 6
    elite_radius: 20
    elite_speed: 65
    pursuit_seconds: 2.0
    windup_seconds: 0.8
    charge_seconds: 0.5
    recovery_seconds: 1.0
    charge_speed: 420
